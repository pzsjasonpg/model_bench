apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-bench-test
  labels:
    app: model-bench-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-bench-test
  template:
    metadata:
      labels:
        app: model-bench-test
    spec:
      # 对应 --network host，共享宿主机网络命名空间
      hostNetwork: true
      # 可选：当使用 hostNetwork 时，dnsPolicy 设为 ClusterFirstWithHostNet
      # 可让 Pod 在宿主机网络下仍能解析集群内部 DNS
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: model-bench-test
          image: model-bench:v1.0.0
          # 对应 docker run bash，保持容器运行，等待用户 exec 进入执行测试
          command: ["bash"]
          args: ["-c", "sleep infinity"]
          # 对应 -v ${PWD}:/app，挂载宿主机目录到 /app
          volumeMounts:
            - name: app-data
              mountPath: /app
          # 资源限制（根据实际需要调整）
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          env:
            # 可预设环境变量，如模型地址等
            - name: TZ
              value: Asia/Shanghai
            - name: PYTHONUNBUFFERED
              value: "1"
      volumes:
        - name: app-data
          hostPath:
            # 对应 ${PWD}，宿主机上的工作目录
            path: /home/pengzs/code/model_bench
            type: DirectoryOrCreate
---
# 可选 Service（hostNetwork 下通常不需要通过 Service 访问 Pod）
# 但如果需要集群内 DNS 发现，可以取消注释
