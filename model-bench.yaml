apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-bench-test
  labels:
    app: model-bench-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-bench-test
  template:
    metadata:
      labels:
        app: model-bench-test
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: model-bench-test
          image: model-bench:v1.0.0
          command: ["bash"]
          args: ["-c", "chmod +x /app/start_all.sh && exec /app/start_all.sh"]
          volumeMounts:
            - name: app-data
              mountPath: /app
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: PYTHONUNBUFFERED
              value: "1"
      volumes:
        - name: app-data
          hostPath:
            path: /home/pengzs/code/model_bench
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: model-bench-svc
  labels:
    app: model-bench-test
spec:
  selector:
    app: model-bench-test
  ports:
    - name: backend
      protocol: TCP
      port: 38081
      targetPort: 38081
    - name: frontend
      protocol: TCP
      port: 38080
      targetPort: 38080
